[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests that train a model or run a full ablation (deselect with '-m "not slow"')
    cuda: requires a CUDA device
    integration: exercises the full HTTP surface